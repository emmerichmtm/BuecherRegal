<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Shelf</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#2b241d,#171310);
    font-family:Georgia,"Times New Roman",serif;color:#e8ded0}
  .shelf{max-width:640px;padding:40px 24px}
  h1{font-weight:400;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#a6998a;margin:0 0 28px}
  a.book{display:block;padding:18px 22px;margin-bottom:14px;text-decoration:none;
    background:#faf5ea;color:#2c2721;border-radius:3px 6px 6px 3px;
    border-left:5px solid #8f3222;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  a.book:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.55)}
  a.book b{display:block;font-size:17px;margin-bottom:4px}
  a.book span{font-size:13px;color:#6a6055}
</style>
</head>
<body>
<div class="shelf">
  <h1>Book Shelf</h1>
  <a class="book" href="Emmerich%202026%20Riesz%20Planar%20NP-Hardness/emmerich-2026-riesz-planar_book.html">
    <b>Riesz s-Energy Subset Selection is NP-Hard in the Euclidean Plane</b>
    <span>Emmerich &middot; Pereverdieva &middot; Deutz &mdash; August 2026</span>
  </a>
  <a class="book" href="Emmerich%202026%20Chan%20Hypervolume/emmerich-2026-chan-hv_book.html">
    <b>Implementation of Chan&rsquo;s Algorithm for Computing the Hypervolume Indicator</b>
    <span>Emmerich &mdash; August 2026</span>
  </a>
</div>
</body>
</html>
