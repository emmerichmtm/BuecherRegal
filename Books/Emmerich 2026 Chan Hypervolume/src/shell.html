<title>Chan Hypervolume</title>
<style>/*__KATEX_CSS__*/</style>
<style>/*__BOOK_CSS__*/</style>

<div id="loader">
  <div class="ldr-title">Setting the type&hellip;</div>
  <div class="ldr-bar"><span></span></div>
</div>

<div id="app">

  <div id="toolbar">
    <div class="tb-title">Chan&nbsp;<b>Hypervolume</b>&nbsp;Implementation</div>

    <div class="tb-group" id="tools">
      <button class="tbtn on" data-tool="read" title="Read — no annotation (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c3-1.4 6-1.4 9 0v13c-3-1.4-6-1.4-9 0z"/><path d="M21 5.5c-3-1.4-6-1.4-9 0v13c3-1.4 6-1.4 9 0z"/></svg>
        <span class="lbl">Read</span><span class="k">R</span>
      </button>
      <button class="tbtn" data-tool="hl" title="Highlighter (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5 20.5 9.5 11 19H5v-6z"/><path d="M3 22h18"/></svg>
        <span class="lbl">Marker</span><span class="k">H</span>
      </button>
      <button class="tbtn" data-tool="pen" title="Pencil (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M15 6l3 3"/><path d="M4 20l1-4"/></svg>
        <span class="lbl">Pencil</span><span class="k">P</span>
      </button>
      <button class="tbtn" data-tool="note" title="Sticky note (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v10l-6 6H4z"/><path d="M20 14h-6v6"/></svg>
        <span class="lbl">Note</span><span class="k">N</span>
      </button>
      <button class="tbtn" data-tool="erase" title="Erase strokes (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20 3.5 15.5a2 2 0 0 1 0-2.8l8-8a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L14 20z"/><path d="M8 20h12"/><path d="M9 9l6 6"/></svg>
        <span class="lbl">Erase</span><span class="k">E</span>
      </button>
    </div>

    <div id="swatches" class="hidden"></div>

    <div class="tb-sep"></div>
    <button class="tbtn icon" id="btnUndo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11a5 5 0 0 1 0 10H9"/><path d="M7 5 3 9l4 4"/></svg>
    </button>
    <button class="tbtn icon" id="btnClear" title="Clear annotations on this spread">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h8l1-13"/></svg>
    </button>

    <div class="spacer"></div>

    <button class="tbtn" id="btnToc" title="Contents (C)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="lbl">Contents</span>
    </button>
    <button class="tbtn icon" id="btnZoomOut" title="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M8.5 11h5"/><path d="M20 20l-4.2-4.2"/></svg>
    </button>
    <button class="tbtn icon" id="btnZoomIn" title="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M8.5 11h5M11 8.5v5"/><path d="M20 20l-4.2-4.2"/></svg>
    </button>
    <button class="tbtn icon" id="btnSpread" title="One page / two pages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16"/><rect x="13" y="4" width="8" height="16"/></svg>
    </button>
    <button class="tbtn icon" id="btnTheme" title="Day / night">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"/></svg>
    </button>
    <button class="tbtn icon" id="btnFull" title="Full screen (F)">
      <svg id="fsExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/></svg>
      <svg id="fsShrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9h5V4"/><path d="M20 9h-5V4"/><path d="M4 15h5v5"/><path d="M20 15h-5v5"/></svg>
    </button>
    <button class="tbtn icon" id="btnMore" title="Save &amp; more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg>
    </button>
  </div>

  <div id="stage">
    <div id="fitbox"><div id="scaler">
      <div id="book">
        <div class="board left"></div>
        <div class="board right"></div>
        <div class="edge l"></div>
        <div class="edge r"></div>
      </div>
    </div></div>
  </div>

  <div id="navbar">
    <button class="tbtn icon" id="btnFirst" title="First page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5l-7 7 7 7"/><path d="M8 5v14"/></svg>
    </button>
    <button class="tbtn icon" id="btnPrev" title="Previous (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <input id="slider" type="range" min="0" max="1" value="0" step="1" aria-label="Page">
    <button class="tbtn icon" id="btnNext" title="Next (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="tbtn icon" id="btnLast" title="Last page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l7 7-7 7"/><path d="M16 5v14"/></svg>
    </button>
    <div id="pageLabel">&mdash;</div>
  </div>
</div>

<div class="overlay" id="tocOverlay">
  <div class="sheet" style="position:relative">
    <button class="tbtn icon sheet-close" data-close="1">&times;</button>
    <h3>Contents</h3>
    <div class="toc-list" id="tocList"></div>
  </div>
</div>

<div class="overlay" id="moreOverlay">
  <div class="sheet" style="position:relative;min-width:min(430px,88vw)">
    <button class="tbtn icon sheet-close" data-close="1">&times;</button>
    <h3>Your annotations</h3>
    <p style="font-size:13.5px;line-height:1.6;color:var(--ui-dim);margin:0 0 16px;max-width:44ch">
      Marks are saved in this browser as you write. Export a backup file to move them to another
      machine, or to keep them safe.
    </p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="tbtn" id="btnPrint">Print / PDF</button>
      <button class="tbtn" id="btnExport">Export backup</button>
      <button class="tbtn" id="btnImport">Import backup</button>
      <button class="tbtn" id="btnWipe">Erase everything</button>
    </div>
    <input type="file" id="fileIn" accept="application/json" style="display:none">
    <div id="statLine" style="margin-top:18px;font-size:12.5px;color:var(--ui-dim)"></div>
  </div>
</div>

<div id="toast"></div>

<div id="source">/*__CONTENT__*/</div>
<div id="pagesHost"></div>

<script>/*__KATEX_JS__*/</script>
<script>/*__BOOK_JS__*/</script>
